//==================================================================================//
//  BIOLOGICAL SAMPLE											//
//==================================================================================//

EXPERIMENT_DEFINITION
{
	id = RP0reentry1
	title = Intermediate Speed Re-entry Payload
	baseValue = 5
	scienceCap = 5
	dataScale = 10
	requireAtmosphere = False
	situationMask = 12
	biomeMask = 0	
	
	RESULTS
	{
		default = Observations are recorded regarding the payload in the current conditions.
	}
	KERBALISM_EXPERIMENT
	{
		// sample mass in tons. if undefined or 0, the experiment produce a file
		SampleMass = 0.0002
		// Body restrictions, multiple lines allowed (just don't use conflicting combinations).
		BodyAllowed = HomeBody
		IncludeExperiment = 
	}
}


//==========================================//
//	General Science Module					//
//==========================================//

@PART[RO-IntermediateSpeedReentry]:FOR[RP-0]
{	
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = RP0reentry1
		experimentActionName = Observe Re-entry Payload
		resetActionName = Discard Data
		reviewActionName = Review Stored Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = True
		rerunnable = False
		xmitDataScalar = 0.25
		usageReqMaskInternal = 1
		usageReqMaskExternal = 4
		dataIsCollectable = true
	}
}
@PART[RO-IntermediateSpeedReentry]:AFTER[RP-0]
{
	@title = RE01 - Intermediate Speed Re-entry Payload
	@manufacturer = Generic
	@description = This is a re-entry payload.
}


// ROK

// ============================================================================
// Replacing stock experiments
// ============================================================================
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[RP0reentry1]]]:FOR[RP-0-Kerbalism]
{
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[RP0reentry1]]	{}
	MODULE
	{
		name = Experiment
		experiment_id = RP0reentry1
	}
}

// ============================================================================
// Reconfigure experiments(avoiding a global nuke to keep people happy)
// strongly recommendeded to not change anything in this section
// Separate from above due to Configure Groups.
// ============================================================================
@PART[*]:HAS[@MODULE[Experiment]]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[RP0reentry1]]
	{
		%sample_amount = 1
		%ec_rate = 0.00
		%data_rate = 10
		@data_rate /= 30 //30 seconds
		%requires = 
		%resources = 
	}
}

