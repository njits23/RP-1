CONTRACT_TYPE
{
	name = DownrangeIntermediateSpeedReentry
	group = SuborbRocketDev
	agent = Federation Aeronautique Internationale
	title = Intermediate Speed Re-entry
	
	tag = exclude_SoundingDownrange
	
	description = <b>Program: Early Rocket Development<br>Type: <color=green>Required</color></b><br><br>Design, build, and launch a rocket that will travel @/minimumDistance.Print() km or more fully guided over ground while carrying a Intermediate Speed Re-Entry experiment. A bonus will be awarded for a high-precision re-entry. <b><color="white">Your rocket must be suborbital (over 140 km) for the contract to be completed. You must have a Near-Earth avionics unit with sufficient control tonnage on your rocket for the entire flight.</color></b> Perfecting this is part of launch vehicle development to tune your ascent profile and develop high-altitude staging methods. The current distance that your rocket has traveled can be seen in the contract parameters in the Contracts App display for this contract. It will update in real time. &br;&br;<b><color="green">@RP0:f3BadAdvice</color></b>
	
	synopsis = Travel @/minimumDistance.Print() km or more downrange with an uncrewed craft carrying a Intermediate Speed Re-entry experiment.
	
	completedMessage = Congratulations on a successful launch!
	
	sortKey = 104

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	
	targetBody = HomeWorld()
	
	// ************ REWARDS ************
	prestige = Exceptional
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 60
	failureReputation = 0

	// ************ REQUIREMENTS ************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SuborbRocketDev
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = KarmanLine
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingRocket
		invertRequirement = true
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingDownrange
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_EarlySatellite
		invertRequirement = true
	}
	
	DATA
	{
		title = MinimumDistance
		type = int
		minimumDistance = 800
	}
	
	DATA
	{
		title = RangeGateMinDistance
		type = int
		rangeGateMinDistance = 850
	}
	
	DATA
	{
		title = RangeGateMaxDistance
		type = int
		rangeGateMaxDistance = 900
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		
		title = Reach @/minimumDistance.Print() km downrange.
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = BuiltAtVAB
			type = VesselBuiltAt
			builtAt = VAB
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = HaveAvionics
			type = VesselParameterGroup
			title = Maintain sufficient avionics for the entire flight (do not lose control)
			disableOnStateChange = false
			hideChildren = true

			PARAMETER
			{
				name = AvionicsCheck
				type = AvionicsCheck
				continuousControlRequired = true
				hideChildren = true
			}
		}

		PARAMETER
		{
			name = ReachAlt
			type = ReachState
			minAltitude = 140000
			disableOnStateChange = true
			title = Reach an altitude of at least 140 km
			hideChildren = true
		}
		
		PARAMETER
		{
			name = ReachDistance
			type = DownrangeDistance
			distance = @/minimumDistance * 1000
			title = Reach a downrange distance of at least @/minimumDistance.Print() km
		}
		
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}
	
	PARAMETER
	{
		name = IntermediatePrecisionOptVG
		type = VesselParameterGroup
		title = Demonstrate precision re-entry and recover part of the vessel
		rewardReputation = 20
		rewardScience = 5
		optional = true
		hideChildren = false
		
		PARAMETER
		{
			name = RangeGateMinDistance
			type = DownrangeDistance
			distance = @/rangeGateMinDistance * 1000
			title = Reach a downrange distance of at least @/rangeGateMinDistance.Print() km
		}
		
		PARAMETER
		{
			name = not
			type = Not		
		
			PARAMETER
			{
				name = RangeGateMaxDistance
				type = DownrangeDistance
				distance = @/rangeGateMaxDistance * 1000
				title = Reach a downrange distance of at most @/rangeGateMaxDistance.Print() km
			}
		}
		
		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}		
}
